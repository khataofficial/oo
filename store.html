<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Store</title>
<style>
:root{
  --bg:#f2f4f1; --surface:#ffffff; --ink:#17201b; --muted:#66726b; --line:#dde3dd;
  --accent:#0e6b54; --accent-ink:#ffffff; --accent-soft:#e1f1ec; --warn:#b3261e;
  --r:12px; --shadow:0 1px 2px rgba(20,32,27,.06),0 6px 18px rgba(20,32,27,.05);
}
@media (prefers-color-scheme:dark){
  :root{
    --bg:#101512; --surface:#18201b; --ink:#eef3ef; --muted:#97a59c; --line:#27322b;
    --accent:#3fbf98; --accent-ink:#06150f; --accent-soft:#17302a; --warn:#ff8a80;
    --shadow:0 1px 2px rgba(0,0,0,.4);
  }
}
*{box-sizing:border-box;margin:0}
html{scroll-padding-top:70px}
body{font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--ink);line-height:1.5;min-height:100vh}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
button:disabled{cursor:not-allowed;opacity:.5}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.hidden{display:none!important}

/* header */
.top{position:sticky;top:0;z-index:20;background:var(--surface);border-bottom:1px solid var(--line);padding:10px max(16px,env(safe-area-inset-right)) 10px max(16px,env(safe-area-inset-left));padding-top:calc(10px + env(safe-area-inset-top,0px))}
.top-in{max-width:1180px;margin:auto;display:flex;align-items:center;gap:14px}
.brand{display:flex;align-items:center;gap:10px;min-width:0;flex:1}
.logo{width:38px;height:38px;border-radius:10px;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font-weight:700;font-size:18px;overflow:hidden;flex:none}
.logo img{width:100%;height:100%;object-fit:cover}
.brand h1{font-size:18px;line-height:1.2;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.brand small{color:var(--muted);display:block;font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hdr-actions{display:flex;gap:8px;align-items:center}
.ib{position:relative;border:1px solid var(--line);background:var(--surface);border-radius:10px;height:38px;min-width:38px;padding:0 10px;display:inline-flex;align-items:center;justify-content:center;gap:6px;font-weight:600;font-size:14px;transition:background .15s,border-color .15s}
.ib:hover{background:var(--accent-soft);border-color:var(--accent)}
.ib .n{position:absolute;top:-7px;right:-7px;min-width:19px;height:19px;border-radius:99px;background:var(--warn);color:#fff;font-size:11px;display:grid;place-items:center;padding:0 5px;font-weight:700}
.ib .lbl{display:none}
@media(min-width:800px){.ib .lbl{display:inline}}

.btn{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:8px 14px;font-weight:600;font-size:14px;display:inline-flex;align-items:center;justify-content:center;gap:8px;transition:background .15s,border-color .15s;text-decoration:none;color:var(--ink)}
.btn:hover:not(:disabled){background:var(--accent-soft);border-color:var(--accent)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover:not(:disabled){filter:brightness(1.08);background:var(--accent)}
.btn.danger{color:var(--warn)}
.btn.sm{padding:5px 10px;font-size:13px}
svg.i{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round;flex:none}

/* store page */
main{max-width:1180px;margin:auto;padding:20px 16px 90px}
.bar{display:flex;gap:10px;align-items:center;margin-bottom:18px;flex-wrap:wrap}
.search{flex:1;min-width:180px;position:relative}
.search input{width:100%;padding:11px 14px 11px 40px;border:1px solid var(--line);border-radius:10px;background:var(--surface)}
.search svg{position:absolute;left:12px;top:50%;transform:translateY(-50%);color:var(--muted)}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--surface)}
.seg button{border:0;background:none;padding:9px 11px;display:grid;place-items:center;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.info{display:flex;gap:18px;flex-wrap:wrap;color:var(--muted);font-size:13.5px;margin-bottom:16px}
.info span{display:inline-flex;gap:6px;align-items:center}

.products{display:grid;gap:16px}
.products.grid{grid-template-columns:repeat(var(--cols,3),minmax(0,1fr))}
.products.list{grid-template-columns:1fr}
.products.compact{grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:12px}
@media(max-width:820px){.products.grid{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(max-width:420px){.products.grid{gap:10px}}

.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;display:flex;flex-direction:column;box-shadow:var(--shadow)}
.card .ph{aspect-ratio:4/3;background:var(--accent-soft);overflow:hidden;position:relative}
.card .ph img{width:100%;height:100%;object-fit:cover;display:block}
.card .body{padding:12px 14px 14px;display:flex;flex-direction:column;gap:6px;flex:1}
.card h3{font-size:16px;line-height:1.3}
.card p{color:var(--muted);font-size:13.5px}
.tag{font-size:12px;background:var(--accent-soft);color:var(--accent);padding:2px 8px;border-radius:99px;font-weight:600;width:fit-content}
.card .row{margin-top:auto;display:flex;align-items:center;justify-content:space-between;gap:8px;padding-top:6px;flex-wrap:wrap}
.pr{display:flex;align-items:baseline;gap:6px;flex-wrap:wrap}
.pr .now{font-weight:700;font-size:16px}
.pr s{color:var(--muted);font-size:13px}
.unit{color:var(--muted);font-size:12.5px}
.low{color:var(--warn);font-size:12.5px;font-weight:600}
.off{position:absolute;left:8px;top:8px;background:var(--warn);color:#fff;font-size:12px;font-weight:700;padding:2px 8px;border-radius:99px}
.out{position:absolute;right:8px;bottom:8px;background:var(--ink);color:var(--bg);font-size:12px;padding:3px 9px;border-radius:99px}
.step{display:inline-flex;align-items:center;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--surface)}
.step button{border:0;background:var(--surface);width:32px;height:32px;font-size:18px;line-height:1}
.step button:hover:not(:disabled){background:var(--accent-soft)}
.step b{min-width:30px;text-align:center;font-size:14px}

.products.list .card{flex-direction:row}
.products.list .ph{aspect-ratio:auto;width:150px;flex:none}
@media(max-width:520px){.products.list .ph{width:104px}}
.products.compact .card .body{padding:9px 10px 10px;gap:3px}
.products.compact h3{font-size:14px}
.products.compact p,.products.compact .tag{display:none}
.products.compact .row{flex-direction:column;align-items:stretch}
.products.compact .row .btn,.products.compact .row .step{justify-content:center}
.nodesc p{display:none}
.inert{pointer-events:none}

.empty{text-align:center;padding:60px 20px;color:var(--muted);border:1px dashed var(--line);border-radius:var(--r)}
.empty b{display:block;color:var(--ink);font-size:17px;margin-bottom:6px}

/* owner pages */
.page-head{display:flex;align-items:center;gap:12px;margin-bottom:18px;flex-wrap:wrap}
.page-head h2{font-size:22px;flex:1}
.page-head small{color:var(--muted);font-size:13px}
.set{display:grid;grid-template-columns:220px 1fr;gap:22px;align-items:start}
@media(max-width:760px){.set{grid-template-columns:1fr}}
.tabs{display:flex;flex-direction:column;gap:4px;position:sticky;top:76px}
@media(max-width:760px){.tabs{flex-direction:row;overflow-x:auto;position:static;padding-bottom:4px}}
.tabs button{border:0;background:none;text-align:left;padding:10px 12px;border-radius:10px;font-weight:600;color:var(--muted);display:flex;gap:10px;align-items:center;white-space:nowrap}
.tabs button[aria-selected="true"]{background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}
.tb{margin-left:auto;background:var(--warn);color:#fff;border-radius:99px;font-size:11px;padding:1px 7px;font-weight:700}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:22px;box-shadow:var(--shadow);min-width:0}
.panel h3{font-size:18px;margin-bottom:4px}
.panel>.sub,.sub{color:var(--muted);font-size:14px;margin-bottom:18px}
.field{margin-bottom:16px}
.field label,.lab{display:block;font-weight:600;font-size:14px;margin-bottom:6px}
.field small{display:block;color:var(--muted);font-size:12.5px;margin-top:4px}
.field input[type=text],.field input[type=number],.field input[type=tel],.field input[type=email],.field input[type=password],.field select,.field textarea{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--bg)}
.field textarea{min-height:110px;resize:vertical}
.two{display:grid;grid-template-columns:1fr 1fr;gap:14px}
@media(max-width:520px){.two{grid-template-columns:1fr}}
.sw{display:flex;align-items:center;justify-content:space-between;gap:14px;padding:12px 0;border-top:1px solid var(--line)}
.sw.first{border-top:0}
.sw b{display:block;font-size:14.5px}
.sw span{color:var(--muted);font-size:13px}
.toggle{appearance:none;-webkit-appearance:none;width:44px;height:26px;border-radius:99px;background:var(--line);position:relative;cursor:pointer;flex:none;transition:background .15s;border:0}
.toggle::after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#fff;transition:transform .15s;box-shadow:0 1px 2px rgba(0,0,0,.3)}
.toggle:checked{background:var(--accent)}
.toggle:checked::after{transform:translateX(18px)}
.viewpick{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:6px}
.viewpick button{border:2px solid var(--line);background:var(--bg);border-radius:12px;padding:12px;text-align:center;font-weight:600}
.viewpick button[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft)}
.viewpick svg{width:100%;height:56px;margin-bottom:6px;color:var(--accent)}
.imgpick{display:flex;gap:14px;align-items:center;flex-wrap:wrap}
.imgpick .prev{width:120px;aspect-ratio:4/3;border-radius:10px;overflow:hidden;border:1px solid var(--line)}
.imgpick .prev img{width:100%;height:100%;object-fit:cover}
.preview{margin-top:22px;padding-top:18px;border-top:1px solid var(--line)}
.preview .lab{margin-bottom:12px}
.chan{border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-bottom:10px;background:var(--bg)}
.chan-top{display:flex;align-items:center;gap:10px;justify-content:space-between}
.chan-top b{display:flex;gap:10px;align-items:center}
.chan input[type=text],.chan input[type=tel],.chan input[type=email]{width:100%;margin-top:10px;padding:9px 12px;border:1px solid var(--line);border-radius:10px;background:var(--surface)}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
.chips button{border:1px solid var(--line);background:var(--bg);border-radius:99px;padding:3px 10px;font-size:12.5px}
.msgprev{background:var(--accent-soft);border-radius:12px;padding:12px 14px;font-size:14px;white-space:pre-wrap;margin-top:6px}
.note{background:var(--accent-soft);border-radius:12px;padding:12px 14px;font-size:13.5px;margin:14px 0}
.plist{display:flex;flex-direction:column;gap:10px}
.prow{display:flex;gap:12px;align-items:center;border:1px solid var(--line);border-radius:12px;padding:10px;background:var(--bg)}
.prow img{width:56px;height:56px;border-radius:8px;object-fit:cover;flex:none}
.prow .m{flex:1;min-width:0}
.prow .m b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.prow .m span{color:var(--muted);font-size:13px}
.rowhead{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:14px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:16px}
.stat{background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:12px}
.stat b{display:block;font-size:20px;line-height:1.2}
.stat span{color:var(--muted);font-size:13px}
@media(max-width:520px){.stat b{font-size:16px}}

/* orders */
details.ord{border:1px solid var(--line);border-radius:12px;background:var(--bg);margin-bottom:10px}
details.ord>summary{list-style:none;cursor:pointer;display:flex;gap:10px;align-items:center;padding:12px 14px;flex-wrap:wrap}
details.ord>summary::-webkit-details-marker{display:none}
details.ord .grow{flex:1;min-width:140px}
details.ord .grow span{display:block;color:var(--muted);font-size:13px}
.ord .in{padding:12px 14px 14px;border-top:1px solid var(--line)}
.pill{font-size:12px;font-weight:700;padding:2px 10px;border-radius:99px;background:var(--accent-soft);color:var(--accent)}
.pill.new{background:color-mix(in srgb,#f2b632 30%,transparent);color:var(--ink)}
.pill.cancelled{background:color-mix(in srgb,var(--warn) 18%,transparent);color:var(--warn)}
table.t{width:100%;border-collapse:collapse;font-size:14px;margin:10px 0}
.t td,.t th{padding:6px 4px;text-align:left;border-bottom:1px solid var(--line)}
.t td:last-child,.t th:last-child{text-align:right}
.sumrows div{display:flex;justify-content:space-between;gap:10px;padding:3px 0;font-size:14px}
.sumrows .tot{font-weight:700;font-size:16px;border-top:1px solid var(--line);margin-top:6px;padding-top:8px}
.sumrows .save{color:var(--accent)}
.acts{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}

/* dialogs */
dialog{margin:auto;border:0;border-radius:16px;padding:0;width:min(560px,calc(100vw - 24px));max-height:calc(100vh - 24px);background:var(--surface);color:var(--ink);box-shadow:0 20px 60px rgba(0,0,0,.35)}
dialog::backdrop{background:rgba(10,16,13,.55)}
.dlg-h{display:flex;align-items:center;justify-content:space-between;padding:16px 20px;border-bottom:1px solid var(--line)}
.dlg-h h3{font-size:17px}
.dlg-b{padding:18px 20px;overflow:auto;max-height:calc(100vh - 170px)}
.dlg-f{padding:14px 20px;border-top:1px solid var(--line);display:flex;gap:10px;justify-content:flex-end;flex-wrap:wrap}
.x{border:0;background:none;padding:4px;border-radius:8px;color:var(--muted)}
.err{color:var(--warn);font-size:13.5px;font-weight:600;margin-top:8px;min-height:0}
.cline{display:flex;gap:12px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
.cline img{width:56px;height:56px;border-radius:10px;object-fit:cover;flex:none}
.cline .m{flex:1;min-width:0}
.cline .m b{display:block;font-size:14.5px}
.cline .m span{color:var(--muted);font-size:13px}
.cline .rt{text-align:right;display:flex;flex-direction:column;gap:6px;align-items:flex-end}
.cline .lt{font-weight:700;font-size:14px}
.link{border:0;background:none;color:var(--muted);font-size:12.5px;text-decoration:underline;padding:0}
.hint{color:var(--accent);font-size:13px;margin-top:6px}
.fulfil{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px}
.fulfil button{border:2px solid var(--line);background:var(--bg);border-radius:12px;padding:10px;font-weight:600}
.fulfil button[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft)}
.channels{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media(max-width:420px){.channels{grid-template-columns:1fr}}
.channels button{display:flex;gap:10px;align-items:center;justify-content:center;border:1px solid var(--line);border-radius:12px;padding:12px;font-weight:600;background:var(--surface);transition:background .15s,border-color .15s}
.channels button:hover{background:var(--accent-soft);border-color:var(--accent)}
.channels .wa{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);grid-column:1/-1}
.nochan{padding:14px;border:1px dashed var(--line);border-radius:12px;color:var(--muted);text-align:center}
.done{text-align:center;padding:6px 0 14px}
.done .ok{width:54px;height:54px;border-radius:50%;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;margin:0 auto 10px}
.done .ok svg{width:28px;height:28px}
.done h4{font-size:19px}
.nitem{display:flex;gap:12px;padding:12px;border-radius:12px;border:1px solid var(--line);margin-bottom:8px;background:var(--bg);width:100%;text-align:left}
.nitem.unread{border-color:var(--accent);background:var(--accent-soft)}
.nitem .m{flex:1;min-width:0}
.nitem .m b{display:block;font-size:14.5px}
.nitem .m span{color:var(--muted);font-size:13px;display:block}
.toast{position:fixed;left:50%;bottom:calc(22px + env(safe-area-inset-bottom,0px));transform:translate(-50%,20px);background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:99px;font-size:14px;opacity:0;pointer-events:none;transition:.2s;z-index:70;max-width:calc(100vw - 24px);text-align:center}
.toast.on{opacity:1;transform:translate(-50%,0)}
.banner{position:fixed;top:calc(12px + env(safe-area-inset-top,0px));left:50%;transform:translate(-50%,-160%);width:min(440px,calc(100vw - 24px));background:var(--ink);color:var(--bg);border-radius:14px;padding:12px 14px;z-index:80;display:flex;gap:12px;align-items:flex-start;transition:transform .25s;box-shadow:0 10px 30px rgba(0,0,0,.35);cursor:pointer}
.banner.on{transform:translate(-50%,0)}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>

<header class="top">
  <div class="top-in">
    <div class="brand">
      <div class="logo" id="logo"></div>
      <div style="min-width:0"><h1 id="sname"></h1><small id="stag"></small></div>
    </div>
    <div class="hdr-actions" id="hdrActions"></div>
  </div>
</header>

<!-- CUSTOMER STORE -->
<main id="pgStore">
  <div class="bar">
    <label class="search">
      <svg class="i" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></svg>
      <input id="q" type="search" placeholder="Search products" aria-label="Search products">
    </label>
    <div class="seg" id="viewSwitch" role="group" aria-label="Product view"></div>
  </div>
  <div class="info" id="storeInfo"></div>
  <div id="products" class="products"></div>
</main>

<!-- OWNER: MANAGE (store data) -->
<main id="pgManage" class="hidden">
  <div class="page-head">
    <button class="btn" data-act="go" data-page="store"><svg class="i" viewBox="0 0 24 24"><path d="m15 18-6-6 6-6"/></svg>Back to store</button>
    <h2>Manage store</h2>
    <small>Products, orders, store profile and pricing</small>
  </div>
  <div class="set"><nav class="tabs" id="mTabs" role="tablist"></nav><section class="panel" id="mPanel"></section></div>
</main>

<!-- OWNER: SETTINGS -->
<main id="pgSettings" class="hidden">
  <div class="page-head">
    <button class="btn" data-act="go" data-page="store"><svg class="i" viewBox="0 0 24 24"><path d="m15 18-6-6 6-6"/></svg>Back to store</button>
    <h2>Settings</h2>
    <small>Changes are saved automatically</small>
  </div>
  <div class="set"><nav class="tabs" id="sTabs" role="tablist"></nav><section class="panel" id="sPanel"></section></div>
</main>

<!-- cart -->
<dialog id="cartDlg">
  <div class="dlg-h"><h3>Your cart</h3><button class="x" data-close aria-label="Close"><svg class="i" viewBox="0 0 24 24"><path d="M18 6 6 18M6 6l12 12"/></svg></button></div>
  <div class="dlg-b">
    <div id="cartLines"></div>
    <div id="cartForm"></div>
    <div id="cartSum"></div>
    <div class="err" id="coErr" role="alert"></div>
  </div>
  <div class="dlg-f"><button class="btn" data-close>Keep shopping</button><button class="btn primary" id="placeBtn" data-act="place">Place order</button></div>
</dialog>

<!-- order placed -->
<dialog id="doneDlg">
  <div class="dlg-h"><h3>Order placed</h3><button class="x" data-close aria-label="Close"><svg class="i" viewBox="0 0 24 24"><path d="M18 6 6 18M6 6l12 12"/></svg></button></div>
  <div class="dlg-b" id="doneBody"></div>
  <div class="dlg-f"><button class="btn primary" data-close>Done</button></div>
</dialog>

<!-- product editor -->
<dialog id="prodDlg">
  <div class="dlg-h"><h3 id="prodTitle">Product</h3><button class="x" data-close aria-label="Close"><svg class="i" viewBox="0 0 24 24"><path d="M18 6 6 18M6 6l12 12"/></svg></button></div>
  <div class="dlg-b" id="prodBody"></div>
  <div class="dlg-f"><span class="err" id="pErr" style="margin:0 auto 0 0;align-self:center"></span><button class="btn" data-close>Cancel</button><button class="btn primary" id="prodSave">Save product</button></div>
</dialog>

<!-- notifications -->
<dialog id="notifDlg">
  <div class="dlg-h"><h3>Notifications</h3><button class="x" data-close aria-label="Close"><svg class="i" viewBox="0 0 24 24"><path d="M18 6 6 18M6 6l12 12"/></svg></button></div>
  <div class="dlg-b" id="notifBody"></div>
  <div class="dlg-f"><button class="btn" data-act="clear-notifs">Clear all</button><button class="btn primary" data-act="read-all">Mark all as read</button></div>
</dialog>

<!-- owner PIN -->
<dialog id="pinDlg">

/* =====================================================
   Pricing logic (all maths in whole cents to avoid rounding errors)
===================================================== */
const cents=n=>Math.round((Number(n)||0)*100);
function fmt(c){const v=c/100;return `${S.pricing.currency} ${v.toLocaleString('en-US',{minimumFractionDigits:Number.isInteger(v)?0:2,maximumFractionDigits:2})}`}
const hasSale=p=>p.sale>0&&p.sale<p.price;
const eff=p=>cents(hasSale(p)?p.sale:p.price);
const orig=p=>cents(p.price);
const maxQty=p=>p.track?Math.max(0,Math.floor(p.stock)||0):99;
function calc(lines,fulfil){
  let sub=0,save=0,count=0;
  lines.forEach(({p,qty})=>{sub+=eff(p)*qty;save+=(orig(p)-eff(p))*qty;count+=qty});
  const pr=S.pricing;
  const free=pr.freeAbove>0&&sub>=cents(pr.freeAbove);
  const delivery=(fulfil==='delivery'&&sub>0)?(free?0:cents(pr.deliveryFee)):0;
  const tax=Math.round(sub*(pr.taxPct||0)/100);
  return {sub,save,delivery,tax,total:sub+delivery+tax,count,free};
}

function autoImg(name){
  let h=0;for(const c of name||'x')h=(h*31+c.charCodeAt(0))%360;
  const ch=esc((name||'?').trim().charAt(0).toUpperCase());
  const svg=`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300"><rect width="400" height="300" fill="hsl(${h} 38% 88%)"/><circle cx="330" cy="40" r="90" fill="hsl(${h} 38% 82%)"/><circle cx="40" cy="290" r="110" fill="hsl(${h} 38% 82%)"/><text x="200" y="185" text-anchor="middle" font-family="system-ui,sans-serif" font-size="120" font-weight="700" fill="hsl(${h} 40% 32%)">${ch}</text></svg>`;
  return 'data:image/svg+xml;utf8,'+encodeURIComponent(svg);
}
const imgOf=p=>p.img||S.display.defaultImg||autoImg(p.name);
function resize(file,max=640,q=.72){
  return new Promise((res,rej)=>{
    const fr=new FileReader();fr.onerror=rej;
    fr.onload=()=>{const im=new Image();im.onerror=rej;im.onload=()=>{
      const k=Math.min(1,max/Math.max(im.width,im.height));
      const c=document.createElement('canvas');c.width=Math.round(im.width*k);c.height=Math.round(im.height*k);
      c.getContext('2d').drawImage(im,0,0,c.width,c.height);res(c.toDataURL('image/jpeg',q));
    };im.src=fr.result};
    fr.readAsDataURL(file);
  });
}

let cart={};try{cart=JSON.parse(localStorage.getItem(CART_KEY))||{}}catch(e){}
const saveCart=()=>{try{localStorage.setItem(CART_KEY,JSON.stringify(cart))}catch(e){}};
function cleanCart(){
  Object.keys(cart).forEach(id=>{
    const p=P(id);
    if(!p||p.active===false||maxQty(p)<=0||!(cart[id]>0))delete cart[id];
    else cart[id]=Math.min(Math.floor(cart[id]),maxQty(p));
  });
}
const cartLines=()=>{cleanCart();return Object.entries(cart).map(([id,qty])=>({p:P(id),qty}))};
const cartCount=()=>cartLines().reduce((a,l)=>a+l.qty,0);
function refreshCart(){
  saveCart();renderChrome();

}

function cardHTML(p){
  const e=eff(p),o=orig(p),sale=e<o,pct=sale?Math.round((o-e)/o*100):0,mx=maxQty(p),qty=cart[p.id]||0;
  const out=mx<=0,low=p.track&&mx>0&&mx<=S.notify.lowStock;
  const action=out?`<button class="btn sm" disabled>Sold out</button>`:
    qty?`<div class="step"><button data-act="dec" data-id="${p.id}" aria-label="Decrease quantity">−</button><b>${qty}</b><button data-act="inc" data-id="${p.id}" aria-label="Increase quantity" ${qty>=mx?'disabled':''}>+</button></div>`:
    `<button class="btn primary sm" data-act="add" data-id="${p.id}">Add to cart</button>`;
  return `<article class="card ${S.display.showDesc?'':'nodesc'}">
    <div class="ph"><img src="${imgOf(p)}" alt="${esc(p.name)}" loading="lazy">${sale?`<span class="off">−${pct}%</span>`:''}${out?'<span class="out">Sold out</span>':''}</div>
    <div class="body">
      ${p.cat?`<span class="tag">${esc(p.cat)}</span>`:''}
      <h3>${esc(p.name)}</h3>
      ${p.desc?`<p>${esc(p.desc)}</p>`:''}
      ${low?`<span class="low">Only ${mx} left</span>`:''}
      <div class="row"><div class="pr"><span class="now">${fmt(e)}</span>${sale?`<s>${fmt(o)}</s>`:''}${p.unit?`<span class="unit">/ ${esc(p.unit)}</span>`:''}</div>${action}</div>
    </div></article>`;
}

/* =====================================================
   Owner sign-in (PIN)
===================================================== */
const hash=s=>{let h1=0xdeadbeef,h2=0x41c6ce57;const t='dukaan|'+s;for(let i=0;i<t.length;i++){const c=t.charCodeAt(i);h1=Math.imul(h1^c,2654435761);h2=Math.imul(h2^c,1597334677)}h1=Math.imul(h1^(h1>>>16),2246822507)^Math.imul(h2^(h2>>>13),3266489909);h2=Math.imul(h2^(h2>>>16),2246822507)^Math.imul(h1^(h1>>>13),3266489909);return(4294967296*(2097151&h2)+(h1>>>0)).toString(36)};
let pinMode='login',pinFails=0,pinLock=0;
function openOwner(){
  S=load();pinMode=S.security.pin?'login':'setup';
  $('#pinTitle').textContent=pinMode==='setup'?'Create owner PIN':'Owner sign in';
  $('#pinBody').innerHTML=pinMode==='setup'
   ?`<p class="sub">Create a PIN (4–8 digits). You will use it to open Manage and Settings.</p>
     <div class="field"><label for="pin1">New PIN</label><input id="pin1" type="password" inputmode="numeric" maxlength="8" autocomplete="new-password"></div>
     <div class="field"><label for="pin2">Confirm PIN</label><input id="pin2" type="password" inputmode="numeric" maxlength="8" autocomplete="new-password"></div><div class="err" id="pinErr"></div>`
   :`<div class="field"><label for="pin1">Owner PIN</label><input id="pin1" type="password" inputmode="numeric" maxlength="8" autocomplete="current-password"></div><div class="err" id="pinErr"></div>
     <button class="link" data-act="forgot">Forgot PIN?</button>`;
  $('#pinDlg').showModal();setTimeout(()=>$('#pin1').focus(),50);
}
function pinErr(m){$('#pinErr').textContent=m}
function submitPin(){
  const a=$('#pin1').value.trim();
  if(pinMode==='setup'){
    if(!/^\d{4,8}$/.test(a))return pinErr('PIN must be 4 to 8 digits.');
    if(a!==$('#pin2').value.trim())return pinErr('The two PINs do not match.');
    S.security.pin=hash(a);save();enterOwner();
  }else{
    if(Date.now()<pinLock)return pinErr(`Too many attempts. Try again in ${Math.ceil((pinLock-Date.now())/1000)} seconds.`);
    if(hash(a)===S.security.pin){pinFails=0;enterOwner()}
    else{pinFails++;if(pinFails>=5){pinLock=Date.now()+30000;pinFails=0}pinErr('Incorrect PIN.')}
  }
}
$('#pinOk').onclick=submitPin;
$('#pinBody').addEventListener('keydown',e=>{if(e.key==='Enter')submitPin()});
function enterOwner(){
  sessionStorage.setItem('owner','1');unlockAudio();$('#pinDlg').close();
  go('manage');toast('Signed in as owner');
}

function renderArea(a,panelToo=true){
  const m=a==='manage',tabs=m?MTABS:STABS,cur=m?mtab:stab;
  const newCount=S.orders.filter(o=>o.status==='new').length;
  $(m?'#mTabs':'#sTabs').innerHTML=tabs.map(([k,l,ic])=>`<button role="tab" data-act="tab" data-area="${a}" data-t="${k}" aria-selected="${k===cur}">${ICON[ic]}${l}${(m&&k==='orders'&&newCount)?`<span class="tb">${newCount}</span>`:''}</button>`).join('');
  if(panelToo){
    const f=(m?{orders:pOrders,products:pProducts,profile:pProfile,pricing:pPricing}:{display:pDisplay,comm:pComm,notify:pNotify,security:pSecurity})[cur];
    $(m?'#mPanel':'#sPanel').innerHTML=f();
  }
}

/* ---------- Manage: orders ---------- */
function orderVars(o){
  return {store:S.store.name,order:o.id,name:o.customer.name,phone:o.customer.phone,
    address:o.fulfil==='delivery'?'Delivery to: '+o.customer.address:'Pickup from store',
    items:o.lines.map(l=>`• ${l.qty} × ${l.name}${l.unit?` (${l.unit})`:''} — ${fmt(l.price*l.qty)}`).join('\n'),
    total:fmt(o.totals.total),note:o.note||'-',status:STATUS[o.status]};
}
const fill=(t,map)=>String(t).replace(/\{(\w+)\}/g,(m,k)=>k in map?map[k]:m);
function waNum(v){let d=digits(v);if(d.startsWith('00'))d=d.slice(2);else if(d.startsWith('0'))d=(S.comm.cc||'92')+d.slice(1);return d}
function orderHTML(o){
  const t=o.totals,c=o.customer;
  const next=o.status==='new'?[['confirmed','Confirm order',1],['cancelled','Cancel order',0]]:o.status==='confirmed'?[['delivered',o.fulfil==='pickup'?'Mark picked up':'Mark delivered',1],['cancelled','Cancel order',0]]:[];
  const msg=encodeURIComponent(fill(S.comm.updateTemplate,orderVars(o)));
  return `<details class="ord" ${o.status==='new'?'open':''}>
   <summary><b>${esc(o.id)}</b><span class="pill ${o.status}">${STATUS[o.status]}</span>
     <span class="grow">${esc(c.name)}<span>${fmtDate(o.ts)} · ${o.lines.reduce((a,l)=>a+l.qty,0)} items · ${o.fulfil==='pickup'?'Pickup':'Delivery'}</span></span>
     <b>${fmt(t.total)}</b></summary>
   <div class="in">
    <div style="font-size:14px"><b>${esc(c.name)}</b> · ${esc(c.phone)}<br>${o.fulfil==='delivery'?esc(c.address):'Pickup from store'}${o.note?`<br><i>Note: ${esc(o.note)}</i>`:''}</div>
    <table class="t"><tr><th>Item</th><th>Qty</th><th>Price</th><th>Total</th></tr>
     ${o.lines.map(l=>`<tr><td>${esc(l.name)}${l.unit?` <span class="unit">(${esc(l.unit)})</span>`:''}</td><td>${l.qty}</td><td>${fmt(l.price)}</td><td>${fmt(l.price*l.qty)}</td></tr>`).join('')}</table>
    <div class="sumrows"><div><span>Subtotal</span><span>${fmt(t.sub)}</span></div>
     ${t.save>0?`<div class="save"><span>You saved (customer)</span><span>${fmt(t.save)}</span></div>`:''}
     ${o.fulfil==='delivery'?`<div><span>Delivery</span><span>${t.delivery?fmt(t.delivery):'Free'}</span></div>`:''}
     ${t.tax?`<div><span>Tax</span><span>${fmt(t.tax)}</span></div>`:''}
     <div class="tot"><span>Total</span><span>${fmt(t.total)}</span></div></div>
    <div class="acts">
     ${next.map(([s,l,pri])=>`<button class="btn sm ${pri?'primary':'danger'}" data-act="status" data-o="${o.id}" data-s="${s}">${l}</button>`).join('')}
     <a class="btn sm" target="_blank" rel="noopener" href="https://wa.me/${waNum(c.phone)}?text=${msg}">${ICON.wa}Message customer</a>
     <a class="btn sm" href="tel:${esc(c.phone)}">${ICON.call}Call</a>
    </div></div></details>`;
}
function pOrders(){
  const today=new Date().toDateString();
  const nNew=S.orders.filter(o=>o.status==='new').length,nToday=S.orders.filter(o=>new Date(o.ts).toDateString()===today).length;
  const rev=S.orders.filter(o=>o.status==='confirmed'||o.status==='delivered').reduce((a,o)=>a+o.totals.total,0);
  const list=S.orders.filter(o=>ordFilter==='all'||o.status===ordFilter);
  return `<div class="stats"><div class="stat"><b>${nNew}</b><span>New orders</span></div><div class="stat"><b>${nToday}</b><span>Orders today</span></div><div class="stat"><b>${fmt(rev)}</b><span>Confirmed sales</span></div></div>
   <div class="rowhead"><h3>Orders</h3><select data-of aria-label="Filter orders by status" style="padding:8px 10px;border:1px solid var(--line);border-radius:10px;background:var(--bg)">
     ${[['all','All orders'],...Object.entries(STATUS)].map(([k,l])=>`<option value="${k}" ${ordFilter===k?'selected':''}>${l}</option>`).join('')}</select></div>
   ${list.length?list.map(orderHTML).join(''):`<div class="empty"><b>No orders ${ordFilter==='all'?'yet':'with this status'}</b>New orders from customers appear here with an alert.</div>`}`;
}
function setStatus(id,s){
  S=load();const o=S.orders.find(x=>x.id===id);if(!o)return;
  const ok={new:['confirmed','cancelled'],confirmed:['delivered','cancelled']}[o.status];
  if(!ok||!ok.includes(s))return;
  if(s==='cancelled'){
    if(!confirm(`Cancel ${id}? Reserved stock will be returned.`))return;
    o.lines.forEach(l=>{const p=P(l.pid);if(p&&p.track)p.stock+=l.qty});
  }
  o.status=s;o.updated=Date.now();
  S.notifs.forEach(n=>{if(n.ref===id&&n.type==='order')n.read=true});
  save(`${id} is now ${STATUS[s].toLowerCase()}`);renderChrome();renderArea('manage');
}

function editProduct(id){
  const p=id?P(id):{name:'',cat:'',unit:'',price:'',sale:'',track:false,stock:0,desc:'',img:'',active:true};
  editing=id||null;editImg=p.img||'';
  $('#prodTitle').textContent=id?'Edit product':'Add product';$('#pErr').textContent='';
  $('#prodBody').innerHTML=`
   <div class="field"><label for="pN">Name</label><input id="pN" type="text" value="${esc(p.name)}"></div>
   <div class="two"><div class="field"><label for="pC">Category</label><input id="pC" type="text" value="${esc(p.cat)}"></div>
   <div class="field"><label for="pU">Unit</label><input id="pU" type="text" list="units" value="${esc(p.unit)}" placeholder="piece, kg, dozen"><datalist id="units"><option>piece</option><option>kg</option><option>1 kg</option><option>dozen</option><option>pack</option><option>litre</option><option>pair</option></datalist></div></div>
   <div class="two"><div class="field"><label for="pP">Regular price</label><input id="pP" type="number" min="0" step="0.01" inputmode="decimal" value="${p.price}"></div>
   <div class="field"><label for="pSale">Sale price (optional)</label><input id="pSale" type="number" min="0" step="0.01" inputmode="decimal" value="${p.sale||''}"><small id="pDisc"></small></div></div>
   <div class="sw first"><div><b>Track stock</b><span>Customers cannot order more than you have.</span></div><input class="toggle" type="checkbox" id="pT" ${p.track?'checked':''}></div>
   <div class="field ${p.track?'':'hidden'}" id="pStockBox" style="margin-top:10px"><label for="pStock">Quantity in stock</label><input id="pStock" type="number" min="0" step="1" inputmode="numeric" value="${p.stock||0}"></div>
   <div class="field"><label for="pD">Description</label><textarea id="pD">${esc(p.desc)}</textarea></div>
   <div class="field"><span class="lab">Image</span><div class="imgpick"><div class="prev"><img id="pPrev" src="${p.img||S.display.defaultImg||autoImg(p.name||'P')}" alt=""></div>
    <div style="display:flex;gap:8px;flex-wrap:wrap"><label class="btn sm">Choose image<input type="file" accept="image/*" data-file="prod" hidden></label><button class="btn sm danger" type="button" data-act="p-img-reset">Use default image</button></div></div></div>
   <div class="sw"><div><b>Show in store</b><span>Hidden products are not shown to customers.</span></div><input class="toggle" type="checkbox" id="pA" ${p.active!==false?'checked':''}></div>`;
  updateDisc();$('#prodDlg').showModal();
}
function updateDisc(){
  const a=Number($('#pP').value),b=Number($('#pSale').value),el=$('#pDisc');if(!el)return;
  el.textContent=(a>0&&b>0&&b<a)?`Customers save ${Math.round((a-b)/a*100)}%`:'';
}
$('#prodDlg').addEventListener('input',e=>{if(e.target.id==='pP'||e.target.id==='pSale')updateDisc()});
$('#prodDlg').addEventListener('change',e=>{if(e.target.id==='pT')$('#pStockBox').classList.toggle('hidden',!e.target.checked)});
$('#prodSave').onclick=()=>{
  const bad=m=>{$('#pErr').textContent=m;return false};
  const name=$('#pN').value.trim();if(!name)return bad('Enter a product name.');
  const price=Math.round(Number($('#pP').value)*100)/100;if(!(price>0))return bad('Enter a regular price greater than 0.');
  const saleRaw=$('#pSale').value.trim(),sale=saleRaw===''?0:Math.round(Number(saleRaw)*100)/100;
  if(saleRaw!==''&&(!(sale>0)||sale>=price))return bad('Sale price must be above 0 and lower than the regular price.');
  const track=$('#pT').checked;let stock=0;
  if(track){stock=Number($('#pStock').value);if(!Number.isInteger(stock)||stock<0)return bad('Stock must be a whole number, 0 or more.')}
  S=load();
  const o={name,cat:$('#pC').value.trim(),unit:$('#pU').value.trim(),price,sale,track,stock,desc:$('#pD').value.trim(),img:editImg,active:$('#pA').checked};
  if(editing){Object.assign(P(editing),o)}else{S.products.push({id:'p'+Date.now(),...o})}
  if(!save('Product saved'))return;
  $('#prodDlg').close();renderArea('manage');
};

/* =====================================================
   Generic field binding (data-k)
===================================================== */
function setPath(path,val){const k=path.split('.');let o=S;while(k.length>1)o=o[k.shift()];o[k[0]]=val}
function setField(el){
  let v=el.type==='checkbox'?el.checked:el.value;
  if(el.dataset.num!==undefined){v=Math.max(0,Number(v)||0);if(el.dataset.max)v=Math.min(v,Number(el.dataset.max));if(el.dataset.int!==undefined)v=Math.floor(v)}
  setPath(el.dataset.k,v);save();renderChrome();updatePrev();
  if(el.dataset.prev==='tpl')$('#mp').textContent=fill(S.comm.template,orderVars(SAMPLE));
  if(el.dataset.prev==='utpl')$('#ump').textContent=fill(S.comm.updateTemplate,orderVars(SAMPLE));
}
document.addEventListener('input',e=>{
  const el=e.target;
  if(el.dataset&&el.dataset.k&&el.type!=='checkbox'&&el.tagName!=='SELECT')setField(el);
  if(el.dataset&&el.dataset.co)co[el.dataset.co]=el.value;
});
document.addEventListener('change',e=>{
  const el=e.target;
  if(el.dataset&&el.dataset.k&&(el.type==='checkbox'||el.tagName==='SELECT'))setField(el);
  if(el.dataset&&el.dataset.of!==undefined){ordFilter=el.value;renderArea('manage')}
  if(el.dataset&&el.dataset.file&&el.files[0])handleFile(el);
});
async function handleFile(el){
  const k=el.dataset.file,f=el.files[0];
  try{
    if(k==='logo'){S.store.logo=await resize(f,200,.8);save('Logo saved');renderChrome();renderArea('manage')}
    if(k==='default'){S.display.defaultImg=await resize(f);save('Default image saved');renderArea('settings')}
    if(k==='prod'){editImg=await resize(f);$('#pPrev').src=editImg}
  }catch(err){toast('Could not read that image')}
}

/* =====================================================
   Cart dialog + checkout
===================================================== */
let co={fulfil:'delivery',name:'',phone:'',address:'',note:''};
function openCart(){
  let saved={};try{saved=JSON.parse(localStorage.getItem(CUST_KEY))||{}}catch(e){}
  co={fulfil:S.pricing.pickup?co.fulfil:'delivery',name:co.name||saved.name||'',phone:co.phone||saved.phone||'',address:co.address||saved.address||'',note:co.note};
  renderCartLines();renderCartForm();renderCartSum();$('#coErr').textContent='';
  $('#cartDlg').showModal();
}
function renderCartLines(){
  const lines=cartLines();
  $('#cartLines').innerHTML=lines.length?lines.map(({p,qty})=>`<div class="cline"><img src="${imgOf(p)}" alt="">
   <div class="m"><b>${esc(p.name)}</b><span>${fmt(eff(p))}${hasSale(p)?` <s>${fmt(orig(p))}</s>`:''}${p.unit?' / '+esc(p.unit):''}</span></div>
   <div class="rt"><div class="step"><button data-act="dec" data-id="${p.id}" aria-label="Decrease quantity">−</button><b>${qty}</b><button data-act="inc" data-id="${p.id}" aria-label="Increase quantity" ${qty>=maxQty(p)?'disabled':''}>+</button></div>
   <span class="lt">${fmt(eff(p)*qty)}</span><button class="link" data-act="rm" data-id="${p.id}">Remove</button></div></div>`).join('')
   :`<div class="empty"><b>Your cart is empty</b>Add products from the store to get started.</div>`;
  $('#cartForm').classList.toggle('hidden',!lines.length);$('#cartSum').classList.toggle('hidden',!lines.length);
  $('#placeBtn').disabled=!lines.length;
}
function renderCartForm(){
  $('#cartForm').innerHTML=`<div style="margin-top:16px">
   ${S.pricing.pickup?`<div class="fulfil"><button data-act="fulfil" data-f="delivery" aria-pressed="${co.fulfil==='delivery'}">Delivery</button><button data-act="fulfil" data-f="pickup" aria-pressed="${co.fulfil==='pickup'}">Store pickup</button></div>`:''}
   <div class="two"><div class="field"><label for="coN">Your name</label><input id="coN" type="text" data-co="name" autocomplete="name" value="${esc(co.name)}"></div>
   <div class="field"><label for="coP">Phone number</label><input id="coP" type="tel" data-co="phone" autocomplete="tel" value="${esc(co.phone)}"></div></div>
   <div class="field ${co.fulfil==='delivery'?'':'hidden'}" id="coAddrBox"><label for="coA">Delivery address</label><input id="coA" type="text" data-co="address" autocomplete="street-address" value="${esc(co.address)}"></div>
   <div class="field"><label for="coT">Note (optional)</label><input id="coT" type="text" data-co="note" value="${esc(co.note)}" placeholder="Size, colour or delivery instructions"></div></div>`;
}
function renderCartSum(){
  const lines=cartLines(),t=calc(lines,co.fulfil),pr=S.pricing;
  let hint='';
  if(co.fulfil==='delivery'&&pr.freeAbove>0&&!t.free&&t.sub>0)hint=`<div class="hint">Add ${fmt(cents(pr.freeAbove)-t.sub)} more for free delivery.</div>`;
  if(pr.minOrder>0&&t.sub<cents(pr.minOrder)&&t.sub>0)hint+=`<div class="hint" style="color:var(--warn)">Minimum order is ${fmt(cents(pr.minOrder))}.</div>`;
  $('#cartSum').innerHTML=`<div class="sumrows" style="margin-top:6px"><div><span>Subtotal (${t.count} item${t.count===1?'':'s'})</span><span>${fmt(t.sub)}</span></div>
   ${t.save>0?`<div class="save"><span>You save</span><span>${fmt(t.save)}</span></div>`:''}
   ${co.fulfil==='delivery'?`<div><span>Delivery</span><span>${t.delivery?fmt(t.delivery):'Free'}</span></div>`:''}
   ${t.tax?`<div><span>Tax (${pr.taxPct}%)</span><span>${fmt(t.tax)}</span></div>`:''}
   <div class="tot"><span>Total</span><span>${fmt(t.total)}</span></div></div>${hint}`;
}
function placeOrder(){
  const fail=m=>{$('#coErr').textContent=m};
  $('#coErr').textContent='';
  const before=JSON.stringify(cart);
  S=load();cleanCart();
  if(JSON.stringify(cart)!==before){saveCart();renderChrome();renderCartLines();renderCartSum();return fail('Some items changed (price, stock or availability). Please review your cart.')}
  const lines=cartLines();if(!lines.length)return fail('Your cart is empty.');
  const name=co.name.trim(),phone=co.phone.trim(),addr=co.address.trim();
  if(name.length<2)return fail('Enter your name.');
  const d=digits(phone);if(d.length<10||d.length>14)return fail('Enter a valid phone number (10 to 14 digits).');
  if(co.fulfil==='delivery'&&addr.length<5)return fail('Enter your delivery address.');
  const t=calc(lines,co.fulfil);
  if(S.pricing.minOrder>0&&t.sub<cents(S.pricing.minOrder))return fail(`The minimum order is ${fmt(cents(S.pricing.minOrder))}.`);
  S.counter=(S.counter||0)+1;
  const id='ORD-'+String(S.counter).padStart(4,'0');
  const order={id,ts:Date.now(),status:'new',fulfil:co.fulfil,customer:{name,phone,address:co.fulfil==='delivery'?addr:''},note:co.note.trim(),
    lines:lines.map(({p,qty})=>({pid:p.id,name:p.name,unit:p.unit||'',price:eff(p),orig:orig(p),qty})),totals:t};
  const alerts=[];
  lines.forEach(({p,qty})=>{
    if(!p.track)return;
    const was=p.stock;p.stock-=qty;
    if(p.stock<=0)alerts.push(['stock',`Sold out: ${p.name}`,'Stock has reached 0. Restock it in Manage > Products.',p.id]);
    else if(p.stock<=S.notify.lowStock&&was>S.notify.lowStock)alerts.push(['stock',`Low stock: ${p.name}`,`Only ${p.stock} left.`,p.id]);
  });
  S.orders.unshift(order);
  addNotif('order',`New order ${id}`,`${name} · ${t.count} item${t.count===1?'':'s'} · ${fmt(t.total)}`,id);
  alerts.forEach(a=>addNotif(...a));
  if(!save())return fail('Could not save the order. Storage may be full.');
  try{localStorage.setItem(CUST_KEY,JSON.stringify({name,phone,address:addr||co.address}))}catch(e){}
  try{const my=JSON.parse(localStorage.getItem(MY_KEY)||'[]');my.push(id);localStorage.setItem(MY_KEY,JSON.stringify(my.slice(-50)))}catch(e){}
  cart={};saveCart();co.note='';
  $('#cartDlg').close();renderChrome();if(curPage==='store')renderStore();
  showDone(order);checkNotifs();
}

/* ---------- order placed: send to store ---------- */
let pendingMsg='',pendingSubject='';
function enabledChannels(){return CHANNELS.filter(c=>S.comm.channels[c.id].on&&S.comm.channels[c.id].v.trim())}
function showDone(o){
  pendingMsg=fill(S.comm.template,orderVars(o));pendingSubject='Order '+o.id;
  const on=enabledChannels();
  $('#doneBody').innerHTML=`<div class="done"><div class="ok">${ICON.check}</div><h4>Thank you, ${esc(o.customer.name)}!</h4>
   <p class="sub" style="margin:4px 0 0">Your order <b>${esc(o.id)}</b> for <b>${fmt(o.totals.total)}</b> has been placed. The store has been notified.</p></div>
   ${on.length?`<div class="lab">Want a faster reply? Send your order details to the store</div><div class="channels">${on.map(c=>`<button data-act="send" data-ch="${c.id}" class="${c.id==='whatsapp'?'wa':''}">${ICON[c.icon]}${c.name}</button>`).join('')}</div>`:''}
   <div style="margin-top:12px"><button class="btn sm" data-act="copy-msg">${ICON.copy}Copy order details</button></div>`;
  $('#doneDlg').showModal();
}
function linkFor(id,v,msg,subject){
  const m=encodeURIComponent(msg);
  switch(id){
   case 'whatsapp':return `https://wa.me/${waNum(v)}?text=${m}`;
   case 'call':return `tel:${v.replace(/\s/g,'')}`;
   case 'sms':return `sms:${v.replace(/\s/g,'')}?body=${m}`;
   case 'email':return `mailto:${v}?subject=${encodeURIComponent(subject)}&body=${m}`;
   case 'telegram':return `https://t.me/${v.replace('@','')}`;
   case 'instagram':return `https://ig.me/m/${v.replace('@','')}`;
  }
}
async function sendVia(ch){
  const v=S.comm.channels[ch].v.trim();
  if(ch==='telegram'||ch==='instagram'){try{await navigator.clipboard.writeText(pendingMsg);toast('Message copied. Paste it into the chat.')}catch(_){}}
  const url=linkFor(ch,v,pendingMsg,pendingSubject);
  if(/^https?:/.test(url))window.open(url,'_blank','noopener');else location.href=url;
}

/* =====================================================
   Notifications
===================================================== */
function addNotif(type,title,body,ref){
  S.notifs.unshift({id:'n'+Date.now().toString(36)+Math.random().toString(36).slice(2,6),type,title,body,ref,ts:Date.now(),read:false});
  S.notifs=S.notifs.slice(0,100);
}
const alerted=new Set(S.notifs.map(n=>n.id));
function checkNotifs(){
  S.notifs.slice().reverse().forEach(n=>{
    if(alerted.has(n.id))return;
    alerted.add(n.id);
    if(!n.read&&owner())fire(n);
  });
  renderChrome();
}
let ac;
function unlockAudio(){try{ac=ac||new(window.AudioContext||window.webkitAudioContext)();ac.resume()}catch(e){}}
function beep(){
  if(!S.notify.sound||!ac)return;
  try{ac.resume();[880,1175].forEach((f,i)=>{const o=ac.createOscillator(),g=ac.createGain();o.frequency.value=f;o.connect(g);g.connect(ac.destination);const t=ac.currentTime+i*.16;g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(.25,t+.02);g.gain.exponentialRampToValueAtTime(.0001,t+.22);o.start(t);o.stop(t+.25)})}catch(e){}
}
let bannerT;
function fire(n){
  beep();
  if(S.notify.vibrate&&navigator.vibrate)try{navigator.vibrate([120,60,120])}catch(e){}
  if(S.notify.browser&&'Notification' in window&&Notification.permission==='granted'&&document.hidden){
    try{const x=new Notification(n.title,{body:n.body,tag:n.id});x.onclick=()=>{window.focus();openNotifItem(n.id)}}catch(e){}
  }
  const b=$('#banner');
  b.innerHTML=`${ICON.bell}<div><b>${esc(n.title)}</b><div style="font-size:13px;opacity:.85">${esc(n.body)}</div></div>`;
  b.dataset.id=n.id;b.classList.add('on');clearTimeout(bannerT);bannerT=setTimeout(()=>b.classList.remove('on'),7000);
}
$('#banner').onclick=()=>{openNotifItem($('#banner').dataset.id)};
function openNotifItem(id){
  S=load();const n=S.notifs.find(x=>x.id===id);
  $('#banner').classList.remove('on');$('#notifDlg').close();
  if(n){n.read=true;save()}
  if(owner()&&n){mtab=n.type==='stock'?'products':'orders';go('manage')}
}
function renderNotifs(){
  $('#notifBody').innerHTML=S.notifs.length?S.notifs.slice(0,50).map(n=>`<button class="nitem ${n.read?'':'unread'}" data-act="notif-open" data-id="${n.id}">${ICON[n.type==='order'?'clip':'box']}<div class="m"><b>${esc(n.title)}</b><span>${esc(n.body)}</span><span>${fmtDate(n.ts)}</span></div></button>`).join('')
   :`<div class="empty"><b>No notifications</b>New orders and low-stock alerts will appear here.</div>`;
}
async function askPermission(){
  if(!('Notification' in window))return toast('This browser does not support notifications');
  try{const r=await Notification.requestPermission();S.notify.browser=r==='granted';save();renderArea('settings');toast(r==='granted'?'Browser notifications enabled':'Permission was not granted')}catch(e){toast('Could not request permission')}
}

/* =====================================================
   Live sync between tabs (new orders, status changes)
===================================================== */
window.addEventListener('storage',e=>{
  if(e.key!==KEY)return;
  const old=S;S=load();
  let my=[];try{my=JSON.parse(localStorage.getItem(MY_KEY)||'[]')}catch(_){}
  S.orders.forEach(o=>{const prev=old.orders.find(x=>x.id===o.id);if(prev&&prev.status!==o.status&&my.includes(o.id))toast(`Your order ${o.id} is now ${STATUS[o.status].toLowerCase()}`)});
  cleanCart();saveCart();
  checkNotifs();
  if(curPage==='store')renderStore();
  else if(curPage==='manage'){renderArea('manage',mtab==='orders'||mtab==='products')}
  if($('#cartDlg').open){renderCartLines();renderCartSum()}
  if($('#notifDlg').open)renderNotifs();
});

/* =====================================================
   Backup / reset
===================================================== */
function exportData(){
  const data=structuredClone(S);data.security={pin:''};
  const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(data,null,2)],{type:'application/json'}));
  a.download='store-backup-'+new Date().toISOString().slice(0,10)+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000);
}
$('#impFile').onchange=e=>{
  const f=e.target.files[0];if(!f)return;
  const fr=new FileReader();
  fr.onload=()=>{
    try{
      const d=JSON.parse(fr.result);if(!d||!Array.isArray(d.products))throw 0;
      if(!confirm('Replace all current products, orders and settings with this backup?'))return;
      const pin=S.security.pin;S=merge(structuredClone(DEFAULTS),d);S.security.pin=pin;
      S.notifs.forEach(n=>alerted.add(n.id));
      save('Backup restored');renderChrome();renderArea('settings');
    }catch(_){toast('That file is not a valid store backup')}
  };
  fr.readAsText(f);e.target.value='';
};

/* =====================================================
   Click actions
===================================================== */
document.addEventListener('click',async e=>{
  const b=e.target.closest('[data-act]');if(!b)return;
  const id=b.dataset.id;
  switch(b.dataset.act){
   case 'go':go(b.dataset.page);break;
   case 'owner':openOwner();break;
   case 'lock':sessionStorage.removeItem('owner');go('store');toast('Signed out of owner mode');break;
   case 'forgot':{
     const t=prompt('This erases ALL store data on this device (products, orders, settings). Type RESET to continue.');
     if(t==='RESET'){[KEY,CART_KEY,CUST_KEY,MY_KEY].forEach(k=>localStorage.removeItem(k));sessionStorage.clear();location.reload()}
     break}
   case 'tab':if(b.dataset.area==='manage')mtab=b.dataset.t;else stab=b.dataset.t;renderArea(b.dataset.area);break;
   case 'view':sessionStorage.setItem('cust_view',b.dataset.v);renderStore();break;
   case 'setview':S.display.view=b.dataset.v;sessionStorage.removeItem('cust_view');save('Default view updated');renderArea('settings');break;
   case 'add':{const p=P(id);if(p&&maxQty(p)>0){cart[id]=1;refreshCart()}break}
   case 'inc':{const p=P(id);if(!p)break;if((cart[id]||0)<maxQty(p)){cart[id]=(cart[id]||0)+1;refreshCart()}else toast(`Only ${maxQty(p)} available`);break}
   case 'dec':{cart[id]=(cart[id]||1)-1;if(cart[id]<=0)delete cart[id];refreshCart();break}
   case 'rm':delete cart[id];refreshCart();break;
   case 'open-cart':openCart();break;
   case 'fulfil':co.fulfil=b.dataset.f;renderCartForm();renderCartSum();break;
   case 'place':placeOrder();break;
   case 'send':sendVia(b.dataset.ch);break;
   case 'copy-msg':try{await navigator.clipboard.writeText(pendingMsg);toast('Order details copied')}catch(_){toast('Could not copy')}break;
   case 'status':setStatus(b.dataset.o,b.dataset.s);break;
   case 'new-p':editProduct();break;
   case 'edit-p':editProduct(id);break;
   case 'del-p':{const p=P(id);if(p&&confirm(`Delete "${p.name}"? Past orders keep their own copy of the item.`)){S=load();S.products=S.products.filter(x=>x.id!==id);cleanCart();save('Product deleted');renderArea('manage')}break}
   case 'p-img-reset':editImg='';$('#pPrev').src=S.display.defaultImg||autoImg($('#pN').value||'P');break;
   case 'logo-del':S.store.logo='';save();renderChrome();renderArea('manage');break;
   case 'def-del':S.display.defaultImg='';save();renderArea('settings');break;
   case 'ins':{const t=$('#'+b.dataset.target),s=t.selectionStart??t.value.length,en=t.selectionEnd??s;t.value=t.value.slice(0,s)+b.dataset.t+t.value.slice(en);t.dispatchEvent(new Event('input',{bubbles:true}));t.focus();t.setSelectionRange(s+b.dataset.t.length,s+b.dataset.t.length);break}
   case 'tpl-reset':S.comm[b.dataset.which]=b.dataset.which==='template'?ORDER_TPL:UPDATE_TPL;save('Message reset');renderArea('settings');break;
   case 'perm':askPermission();break;
   case 'test-notif':{unlockAudio();const n={id:'test'+Date.now(),title:'Test notification',body:'Alerts are working on this device.',type:'order'};fire(n);break}
   case 'open-notif':S=load();renderNotifs();$('#notifDlg').showModal();break;
   case 'notif-open':openNotifItem(id);break;
   case 'read-all':S=load();S.notifs.forEach(n=>n.read=true);save();renderNotifs();renderChrome();break;
   case 'clear-notifs':S=load();S.notifs=[];save();renderNotifs();renderChrome();break;
   case 'change-pin':{
     const a=$('#cp0').value.trim(),n=$('#cp1').value.trim(),er=$('#cpErr');
     if(hash(a)!==S.security.pin)er.textContent='Current PIN is incorrect.';
     else if(!/^\d{4,8}$/.test(n))er.textContent='New PIN must be 4 to 8 digits.';
     else{S.security.pin=hash(n);save('PIN updated');renderArea('settings')}
     break}
   case 'export':exportData();break;
   case 'import':$('#impFile').click();break;
   case 'clear-orders':if(confirm('Delete ALL orders and order notifications? This cannot be undone.')){S=load();S.orders=[];S.notifs=S.notifs.filter(n=>n.type!=='order');save('All orders deleted');renderChrome()}break;
   case 'reset-all':{
     const t=prompt('This erases ALL store data on this device. Type RESET to continue.');
     if(t==='RESET'){[KEY,CART_KEY,CUST_KEY,MY_KEY].forEach(k=>localStorage.removeItem(k));sessionStorage.clear();location.reload()}
     break}
  }
});

/* =====================================================
   Init
===================================================== */
cleanCart();saveCart();
const startPage=location.hash.slice(1);
go(['manage','settings'].includes(startPage)&&owner()?startPage:'store',true);
</script>
