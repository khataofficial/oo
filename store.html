<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Store</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="theme.js"></script>
<script src="khicons.js"></script>
<link rel="stylesheet" href="shop-ui.css">
<style>
*{box-sizing:border-box}body{margin:0;line-height:1.45}
[hidden]{display:none!important}
.rail{position:fixed;left:0;top:0;bottom:0;width:76px;background:var(--card);border-right:1px solid var(--line);display:flex;flex-direction:column;align-items:center;padding:16px 0;gap:6px;z-index:20}
.lg{width:46px;height:46px;border-radius:14px;background:var(--accent);color:var(--on);display:grid;place-items:center;font-weight:800;font-size:19px;overflow:hidden;position:relative;margin-bottom:12px;flex-shrink:0}
.lg img,.th img,.pi img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.rb{width:46px;height:46px;border-radius:14px;border:0;background:transparent;color:var(--soft);display:grid;place-items:center;font-size:22px;position:relative;flex-shrink:0}
.rb:hover{background:var(--chip);color:var(--ink)}.rb.on{background:color-mix(in srgb,var(--accent) 14%,transparent);color:var(--accent)}
.nb{position:absolute;top:3px;right:3px;min-width:17px;height:17px;border-radius:9px;background:var(--accent);color:var(--on);font-size:10px;font-weight:800;display:grid;place-items:center;padding:0 4px}
.sp{flex:1}
.main{margin-left:76px;padding:14px 20px 40px;max-width:1500px}
.top{display:flex;align-items:center;gap:14px;background:var(--card);border:1px solid var(--line);border-radius:18px;padding:9px 12px 9px 18px;position:sticky;top:10px;z-index:15}
.crumb{display:flex;align-items:center;gap:8px;color:var(--soft);font-weight:600;white-space:nowrap}.crumb b{color:var(--ink);display:inline-flex;align-items:center;gap:6px}
.srch{flex:1;max-width:560px;margin:0 auto;position:relative}.srch input{width:100%;padding:11px 46px 11px 42px;background:var(--chip)!important;border-color:transparent!important}
.srch .si{position:absolute;left:14px;top:50%;transform:translateY(-50%);color:var(--soft);font-size:18px;pointer-events:none}
.kbd{position:absolute;right:12px;top:50%;transform:translateY(-50%);font-size:12px;color:var(--soft);border:1px solid var(--line);border-radius:6px;padding:0 7px;pointer-events:none}
.ibx{width:42px;height:42px;border:1px solid var(--line);border-radius:12px;background:var(--card);color:var(--ink);display:grid;place-items:center;font-size:19px;position:relative;flex-shrink:0}
.ibx:hover{background:var(--chip)}
.adm{display:flex;align-items:center;gap:10px;margin-top:12px;padding:10px 14px;border-radius:14px;background:color-mix(in srgb,var(--accent) 12%,var(--card));border:1px solid color-mix(in srgb,var(--accent) 35%,var(--line));font-weight:700}
.adm span.t{flex:1}.adm button{border:0;border-radius:10px;background:var(--accent);color:var(--on);padding:8px 12px;font-weight:700;display:inline-flex;gap:6px;align-items:center}
.hero{display:flex;gap:14px;align-items:center;margin-top:14px;padding:16px 18px;border-radius:20px;background:linear-gradient(135deg,var(--accent),color-mix(in srgb,var(--accent) 55%,#38bdf8));color:var(--on)}
.hero .lg{background:var(--on);color:var(--accent);margin:0;width:54px;height:54px}.hero h2{margin:0;font-size:20px}.hero p{margin:2px 0 8px;opacity:.9}
.bd{display:flex;flex-wrap:wrap;gap:6px}.bd span{display:inline-flex;align-items:center;gap:6px;background:rgba(255,255,255,.2);padding:4px 10px;border-radius:99px;font-size:12px;font-weight:600}
.ban{margin-top:12px;padding:11px 14px;border-radius:14px;background:var(--chip);font-weight:600;display:flex;gap:8px;align-items:center}
.layout{display:grid;grid-template-columns:290px 1fr;gap:18px;margin-top:14px;align-items:start}
.flt{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px;position:sticky;top:78px;max-height:calc(100vh - 94px);overflow:auto}
.fh{display:flex;align-items:center;justify-content:space-between;padding-bottom:12px;border-bottom:1px solid var(--line);margin-bottom:6px}.fh b{display:inline-flex;gap:8px;align-items:center;font-size:16px}
.lk{border:0;background:none;color:var(--accent);font-weight:700;font-size:13px;padding:4px}
.fs{border-bottom:1px solid var(--line);padding:6px 0}.fs:last-child{border:0}
.fs summary{list-style:none;display:flex;align-items:center;justify-content:space-between;font-weight:700;font-size:16px;padding:10px 0;cursor:pointer}.fs summary::-webkit-details-marker{display:none}
.ck{display:flex;align-items:center;gap:10px;padding:7px 0;font-size:15px;font-weight:500;color:var(--ink);cursor:pointer}
.ck input{position:absolute;opacity:0;pointer-events:none}.ck i{width:20px;height:20px;border:1.5px solid var(--line);border-radius:6px;display:grid;place-items:center;color:transparent;font-size:13px;flex-shrink:0}
.ck input:checked+i{background:var(--accent);border-color:var(--accent);color:var(--on)}
.mm{display:flex;align-items:center;gap:8px;margin-top:6px}.mm input{width:100%;padding:9px;text-align:center}
.ri{display:flex;align-items:center;gap:10px;padding:7px 0;color:var(--soft)}.ri .ic{color:var(--accent);font-size:18px}
.head{display:flex;align-items:flex-end;gap:12px;flex-wrap:wrap}.head h1{margin:0;font-size:26px;font-weight:800;line-height:1.1}.head small{color:var(--soft);display:block;margin-top:2px}
.head .sp{flex:1}.head select{padding:9px 12px;font-size:14px;font-weight:600}
.act{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:10px 0 2px}.act:empty{display:none}
.fc{display:inline-flex;align-items:center;gap:6px;background:var(--chip);border-radius:99px;padding:5px 6px 5px 12px;font-size:13px;color:var(--soft)}.fc button{border:0;background:none;color:var(--accent);display:grid;padding:2px}
.fbtn{display:none}
.grid{display:grid;gap:16px;grid-template-columns:repeat(auto-fill,minmax(var(--gw,210px),1fr));margin-top:14px}
.p{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:8px;box-shadow:0 2px 12px rgba(15,23,23,.05);display:flex;flex-direction:column;transition:transform .15s,box-shadow .15s}
.p:hover{transform:translateY(-2px);box-shadow:0 8px 22px rgba(15,23,23,.1)}
.pi{position:relative;aspect-ratio:1.12/1;background:var(--chip);border-radius:14px;display:grid;place-items:center;color:var(--soft);font-size:46px;overflow:hidden;cursor:pointer}
.noim .pi{display:none}
.tg{position:absolute;left:8px;top:8px;background:var(--ink);color:var(--bg);border-radius:99px;padding:3px 10px;font-size:11px;font-weight:700;display:inline-flex;gap:5px;align-items:center}
.pb{padding:10px 8px 6px;display:flex;flex-direction:column;gap:6px;flex:1}
.ph{display:flex;gap:8px;align-items:flex-start;justify-content:space-between}.pn{font-weight:700;font-size:15px;overflow-wrap:anywhere;cursor:pointer}
.hb{border:0;background:none;color:var(--ink);padding:2px;font-size:20px;flex-shrink:0}.hb.on{color:#e11d48}
.pm{display:flex;align-items:center;gap:6px;color:var(--soft);font-size:12px}
.pp{font-size:21px;font-weight:800;margin-top:2px}
.pc{margin-top:auto;padding-top:8px;display:flex;gap:8px}
.add{flex:1;padding:11px;font-size:14px}.add[disabled]{background:var(--chip)!important;color:var(--soft)!important;box-shadow:none!important;cursor:not-allowed}
.qty{flex:1;display:flex;align-items:center;justify-content:space-between;background:var(--accent);color:var(--on);border-radius:14px;padding:3px}
.step{width:38px;height:38px;border:0;background:transparent;color:inherit;font-size:18px;display:grid;place-items:center}.cnt{font-weight:800}
.edt{flex:1;padding:10px;border:1px solid var(--line);border-radius:14px;background:var(--card);color:var(--ink);font-weight:700;display:inline-flex;gap:8px;align-items:center;justify-content:center}
.empty{text-align:center;color:var(--soft);padding:60px 10px;display:grid;gap:8px;justify-items:center}
.sk{height:260px;border-radius:20px;background:linear-gradient(90deg,var(--chip),var(--card),var(--chip));background-size:200% 100%;animation:sh 1.2s infinite}@keyframes sh{to{background-position:-200% 0}}
#bar{position:fixed;left:50%;transform:translateX(-50%);bottom:18px;z-index:30;display:none;align-items:center;gap:14px;background:var(--ink);color:var(--bg);border-radius:99px;padding:8px 8px 8px 20px;box-shadow:0 10px 30px rgba(0,0,0,.25)}
#bar b{font-size:16px}#bar button{border:0;padding:11px 18px;border-radius:99px!important;display:inline-flex;gap:8px;align-items:center}
.ov{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:50;display:none;justify-content:flex-end;align-items:flex-end}.ov.on{display:flex}
.sheet{width:100%;max-width:520px;max-height:92vh;overflow:auto;padding:18px 18px calc(18px + env(safe-area-inset-bottom,0px))}
.sh{display:flex;align-items:center;gap:10px;margin-bottom:12px}.sh h2{margin:0;flex:1;font-size:19px;font-weight:800;display:flex;gap:8px;align-items:center}
.line{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid var(--line)}
.th{position:relative;width:46px;height:46px;border-radius:12px;overflow:hidden;background:var(--chip);display:grid;place-items:center;color:var(--soft);flex-shrink:0}
.line .d{flex:1;min-width:0;font-size:13px;color:var(--soft)}.line .d b{display:block;font-size:14px;color:var(--ink)}
.sum{display:flex;justify-content:space-between;padding:4px 0;color:var(--soft)}.sum.g{color:var(--ink);font-weight:800;font-size:18px;padding-top:10px;margin-top:6px;border-top:1px solid var(--line)}
.fl{display:grid;gap:5px;margin:11px 0}.fl label{display:flex;gap:6px;align-items:center}.fl input,.fl textarea,.fl select{width:100%;padding:11px}
.row{display:flex;gap:8px;margin-top:14px}.row button{flex:1;padding:13px}
.err{color:var(--bad);font-size:13px;margin-top:8px;min-height:18px;font-weight:600}
.seg{display:flex;gap:6px}.seg button{flex:1;padding:11px;border:1px solid var(--line);border-radius:12px;background:var(--card);color:var(--ink);font-weight:700;display:inline-flex;gap:6px;align-items:center;justify-content:center}.seg button.on{background:var(--accent);color:var(--on);border-color:var(--accent)}
.sw{display:flex;align-items:center;gap:12px;padding:11px 0;border-bottom:1px solid var(--line);cursor:pointer}.sw .ic{color:var(--accent);font-size:20px}.sw .t{flex:1;font-weight:600}.sw small{display:block;color:var(--soft);font-weight:400;font-size:12px}
.sw input{appearance:none;-webkit-appearance:none;width:46px!important;height:27px;padding:0!important;border-radius:99px!important;background:var(--line)!important;border:0!important;position:relative;flex:none;cursor:pointer}
.sw input::after{content:"";position:absolute;top:3px;left:3px;width:21px;height:21px;border-radius:50%;background:#fff;transition:.15s;box-shadow:0 1px 3px rgba(0,0,0,.3)}.sw input:checked{background:var(--accent)!important}.sw input:checked::after{left:22px}
.gp{border:1px solid var(--line);border-radius:16px;padding:4px 14px;margin-bottom:12px;background:var(--card)}.gp summary{list-style:none;display:flex;gap:10px;align-items:center;font-weight:800;font-size:15px;padding:12px 0;cursor:pointer}.gp summary::-webkit-details-marker{display:none}.gp summary .ic{color:var(--accent);font-size:20px}.gp summary .cv{margin-left:auto}
.sg{display:grid;grid-template-columns:repeat(6,1fr);gap:10px;margin:8px 0}.sg button{aspect-ratio:1;border-radius:50%;border:3px solid var(--card);box-shadow:0 0 0 1px var(--line)}.sg button.on{box-shadow:0 0 0 3px var(--accent)}
.rl{display:flex;align-items:center;gap:8px;background:var(--chip);border-radius:12px;padding:9px 12px;margin:6px 0}.rl span{flex:1}.rl button{border:0;background:none;color:var(--bad);display:grid}
.big{font-size:48px;color:var(--ok)}.done{text-align:center;padding:10px 0}
a.wa{display:flex;gap:8px;justify-content:center;align-items:center;margin-top:12px;padding:13px;border-radius:14px;background:#16a34a;color:#fff;font-weight:700;text-decoration:none}
.os{font-size:11px;font-weight:800;border-radius:99px;padding:3px 10px;background:var(--chip)}.os.new{background:var(--accent);color:var(--on)}
@media(max-width:899px){
 .rail{top:auto;right:0;width:auto;height:64px;flex-direction:row;justify-content:space-around;border-right:0;border-top:1px solid var(--line);padding:6px 6px calc(6px + env(safe-area-inset-bottom,0px))}.rail .lg,.sp{display:none}
 .main{margin-left:0;padding:10px 12px 150px}.crumb{display:none}.srch{max-width:none;margin:0}.top{padding:8px}
 .layout{grid-template-columns:1fr}.flt{display:none}.fbtn{display:grid}
 #bar{bottom:calc(76px + env(safe-area-inset-bottom,0px))}.hero{padding:14px}.head h1{font-size:22px}
}
@media(min-width:900px){.ov{align-items:stretch}.sheet{max-width:470px;max-height:none;height:100%;border-radius:22px 0 0 22px!important}.sheet.mid{height:auto;max-height:92vh;align-self:center;margin:0 auto;border-radius:22px!important}}
</style>
</head>
<body>
<nav class="rail" id="rail" aria-label="Menu"></nav>
<div class="main">
  <div class="top"><div class="crumb"><span id="cr1">Store</span>/<b><span data-ic="package"></span>Products</b></div>
    <div class="srch"><span class="si"><span data-ic="search"></span></span><input id="q" type="search" placeholder="Search" autocomplete="off" hidden><span class="kbd">/</span></div>
    <button class="ibx fbtn" data-act="fo" aria-label="Filters"><span data-ic="sliders"></span></button>
    <button class="ibx" data-act="cz" aria-label="Customize"><span data-ic="palette"></span></button>
    <button class="ibx" data-act="cv" id="cbtn" aria-label="Cart"><span data-ic="cart"></span></button></div>
  <div id="adm" class="adm" hidden></div>
  <div id="ban" class="ban" hidden></div>
  <div id="hero" class="hero" hidden></div>
  <div class="layout"><aside class="flt" id="flt"></aside>
    <section><div class="head"><div><h1>Products</h1><small id="cnt"></small></div><div class="sp"></div>
      <select id="srt" aria-label="Sort"><option value="">Sort</option><option value="lo">Price: low</option><option value="hi">Price: high</option><option value="az">Name A-Z</option><option value="st">Stock</option></select></div>
      <div class="act" id="act"></div><div id="list"></div></section></div>
</div>
<div id="bar"><span>Cart <b id="tot">0</b></span><button data-act="cv"><span data-ic="cart"></span><span id="bn">0</span></button></div>
<div class="ov" id="ov"><div class="sheet" id="sheet"></div></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script src="config.js"></script>
<script>
(function(){
var $=function(i){return document.getElementById(i);};
var esc=function(t){var d=document.createElement('div');d.textContent=String(t==null?'':t);return d.innerHTML.replace(/"/g,'&quot;');};
var url=function(u){u=String(u||'').trim();return /^https?:\/\/[^\s"'<>]+$/i.test(u)?u:'';};
var ic=function(n,s,f){return KI(n,s,f);};
var P=new URLSearchParams(location.search),slug=(P.get('s')||'').toLowerCase().replace(/[^a-z0-9-]/g,'').slice(0,30);
var C=window.KHATA_CFG||{},sb=null,B=null,ADMIN=false,shop=null,X={},cart={},fav={},ck='',mode='',view='',ui={g:'m',im:1},F={cat:{},min:'',max:'',inn:0,sv:0,sort:''};
try{if(P.get('admin')==='1'&&window.parent!==window&&window.parent.KH_BRIDGE){B=window.parent.KH_BRIDGE;ADMIN=true;}}catch(e){}
try{fav=JSON.parse(localStorage.getItem('kf-fav-'+slug)||'{}');if(!ADMIN)cart=JSON.parse(localStorage.getItem('kf-cart-'+slug)||'{}');ui=Object.assign(ui,JSON.parse(localStorage.getItem('kf-ui')||'{}'));}catch(e){}
function keep(){try{localStorage.setItem('kf-fav-'+slug,JSON.stringify(fav));if(!ADMIN)localStorage.setItem('kf-cart-'+slug,JSON.stringify(cart));localStorage.setItem('kf-ui',JSON.stringify(ui));}catch(e){}}
try{sb=window.supabase.createClient(C.URL,C.KEY,{auth:{persistSession:false,autoRefreshToken:false}});}catch(e){}
var rs=function(n){return ((X&&X.cur)||'Rs')+' '+Math.round((+n||0)*100)/100;};
function thumb(p){var u=url(p.img);return ic('package',40)+(u?'<img src="'+u.replace(/"/g,'%22')+'" alt="" loading="lazy" referrerpolicy="no-referrer" onerror="this.remove()">':'');}
function avail(p){return (+p.price>0)&&(+p.qty>0);}
function isOpen(){if(X.acc===0)return false;if(X.from&&X.to){var d=new Date(),m=d.getHours()*60+d.getMinutes(),a=X.from.split(':'),b=X.to.split(':'),s=+a[0]*60+ +a[1],e=+b[0]*60+ +b[1];return s<=e?(m>=s&&m<e):(m>=s||m<e);}return true;}
function cap(p){return X.maxq>0?Math.min(+p.qty,X.maxq):+p.qty;}
function prod(id){return (shop.products||[]).filter(function(x){return String(x.id)===String(id);})[0];}
function total(){var t=0;(shop.products||[]).forEach(function(p){if(cart[p.id])t+=cart[p.id]*p.price;});return t;}
function count(){var n=0;for(var k in cart)n+=cart[k];return n;}
function applyUI(){document.documentElement.style.setProperty('--gw',{s:'150px',m:'210px',l:'290px'}[ui.g]||'210px');}

/* ---------- rail ---------- */
function rb(i,t,a,on,nb){return '<button class="rb'+(on?' on':'')+'" title="'+t+'" aria-label="'+t+'" data-act="'+a+'">'+ic(i,22)+(nb?'<span class="nb">'+nb+'</span>':'')+'</button>';}
function rail(){var n=shop?String(shop.name||'S').trim().charAt(0).toUpperCase():'S',u=shop&&X.logo?url(X.logo):'';
  var h='<div class="lg">'+esc(n)+(u?'<img src="'+u.replace(/"/g,'%22')+'" alt="" onerror="this.remove()">':'')+'</div>'+rb('home','Store','hm',!F.sv)+rb('heart','Saved','sv',F.sv);
  if(ADMIN)h+=rb('package','Orders','ao')+'<div class="sp"></div>'+rb('settings','Settings','as')+rb('palette','Customize','cz')+rb('log-out','Close','ax');
  else h+=rb('package','Orders','o')+rb('message-circle','Chat','chat')+rb('info','Info','i')+'<div class="sp"></div>'+rb('palette','Customize','cz');
  $('rail').innerHTML=h;}

/* ---------- filters ---------- */
function cats(){var m={},o=false;(shop.products||[]).forEach(function(p){if(p.cat)m[p.cat]=1;else o=true;});var k=Object.keys(m);if(k.length&&o)k.push('Other');return k;}
function bands(){var pr=(shop.products||[]).map(function(p){return +p.price;}).filter(function(v){return v>0;});if(!pr.length)return [];var mx=Math.max.apply(null,pr),nice=function(n){var m=Math.pow(10,Math.max(0,String(Math.round(n)).length-2));return Math.max(1,Math.round(n/m)*m);},a=nice(mx/4),b=nice(mx/2),c=nice(mx*.75);if(!(a<b&&b<c))return [];return [[0,a],[a,b],[b,c],[c,'']];}
function ck_(a,l,on,x){return '<label class="ck"><input type="checkbox" data-act="'+a+'"'+(x||'')+(on?' checked':'')+'><i>'+ic('check',13)+'</i>'+l+'</label>';}
function fsec(t,b){return '<details class="fs" open><summary>'+t+ic('chevron-down',16)+'</summary>'+b+'</details>';}
function fltHTML(){var k=cats(),bd=bands(),dv=X.dv!==0,h='<div class="fh"><b>'+ic('sliders',18)+'Filters</b><button class="lk" data-act="ca">Clear all</button></div>';
  if(k.length)h+=fsec('Category',k.map(function(c){return ck_('fc',esc(c),F.cat[c],' data-k="'+esc(c)+'"');}).join(''));
  if(bd.length)h+=fsec('Price',bd.map(function(b){return ck_('fb',b[1]===''?'Over '+b[0]:b[0]+' - '+b[1],F.min===String(b[0])&&F.max===String(b[1]),' data-lo="'+b[0]+'" data-hi="'+b[1]+'"');}).join('')+'<div class="mm"><input id="fmin" type="number" inputmode="numeric" placeholder="min" value="'+esc(F.min)+'"><span>-</span><input id="fmax" type="number" inputmode="numeric" placeholder="max" value="'+esc(F.max)+'"></div>');
  h+=fsec('Show',ck_('fi','In stock',F.inn)+ck_('fs','Saved',F.sv));
  h+=fsec('Receive','<div class="ri">'+ic(dv?'truck':'ban',20)+(dv?'Home delivery'+(X.fee?' · '+rs(X.fee):' · Free'):'No delivery')+'</div>'+(X.pk?'<div class="ri">'+ic('store',20)+'Pickup</div>':'')+(X.dt?'<div class="ri">'+ic('clock',20)+esc(X.dt)+'</div>':''));
  return h;}
function chips(){var a=[];Object.keys(F.cat).forEach(function(c){if(F.cat[c])a.push(['c:'+c,c]);});if(F.min!==''||F.max!=='')a.push(['pr',(F.min||0)+' - '+(F.max||'∞')]);if(F.inn)a.push(['in','In stock']);if(F.sv)a.push(['sv','Saved']);
  return a.map(function(x){return '<span class="fc">'+esc(x[1])+'<button data-act="rf" data-k="'+esc(x[0])+'" aria-label="Remove">'+ic('x',14)+'</button></span>';}).join('')+(a.length?'<button class="lk" data-act="ca">Clear all</button>':'');}
function list(){var q=$('q').value.trim().toLowerCase(),cs=Object.keys(F.cat).filter(function(c){return F.cat[c];});

  B.orders().then(function(r){var L=(r&&Array.isArray(r.data))?r.data:[];if(view!=='ao')return;
    var h=L.length?L.map(function(o){var it=(o.items||[]).map(function(x){return '<div class="line"><div class="d"><b>'+esc(x.name)+'</b>'+x.qty+' × '+rs(x.price)+'</div><b>'+rs(x.qty*x.price)+'</b></div>';}).join(''),t=o.created_at?new Date(o.created_at).toLocaleString():'',st=o.status==='done'?'Done':o.status==='cancelled'?'Cancelled':'New';
      return '<div class="gp" style="padding:12px 14px"><div style="display:flex;gap:8px;align-items:center"><b style="flex:1">'+esc(o.customer_name||'')+'</b><span class="os '+(st==='New'?'new':'')+'">'+st+'</span></div><div class="pm" style="margin:4px 0">'+ic('phone',14)+esc(o.phone||'')+' · '+esc(t)+'</div><div class="pm">'+ic('map-pin',14)+esc(o.address||'')+'</div>'+it+'<div class="sum g"><span>Total</span><span>'+rs(o.total)+'</span></div><div class="row"><button data-act="ow" data-v="'+esc(String(o.phone||'').replace(/\D/g,''))+'">'+ic('message-circle',18)+'Chat</button>'+(o.status==='new'?'<button class="go" data-act="os" data-id="'+esc(o.id)+'" data-v="done">'+ic('check',18)+'Done</button><button data-act="os" data-id="'+esc(o.id)+'" data-v="cancelled">'+ic('x',18)+'</button>':'')+'</div></div>';}).join(''):'<div class="empty">'+ic('package',34)+'<div>No orders</div></div>';
    setSheet('Orders','package',h);view='ao';}).catch(function(){});}
function prodEdit(id){var p=prod(id);if(!p)return;var cs=cats().filter(function(c){return c!=='Other';});
  open(p.name,'pencil','<div class="fl"><label>'+ic('wallet',14)+'Price</label><input id="ep" type="number" inputmode="decimal" value="'+esc(p.price)+'"></div><div class="fl"><label>'+ic('tag',14)+'Category</label><input id="ec" list="cl" maxlength="30" value="'+esc(p.cat||'')+'"><datalist id="cl">'+cs.map(function(c){return '<option value="'+esc(c)+'">';}).join('')+'</datalist></div><div class="fl"><label>'+ic('pencil',14)+'Text</label><textarea id="ed" rows="3" maxlength="200">'+esc(p.desc||'')+'</textarea></div><label class="sw">'+ic('eye-off',20)+'<span class="t">Hide<small>Not shown in store</small></span><input type="checkbox" id="eh"'+(p.hide?' checked':'')+'></label><div class="row"><button data-act="x">Cancel</button><button class="go" id="es">'+ic('check',18)+'Save</button></div>','pe');
  $('es').onclick=function(){B.setPrice(p.id,$('ep').value);B.setMeta(p.id,{cat:$('ec').value.trim(),desc:$('ed').value.trim(),hide:$('eh').checked});close();after();};}

/* ---------- events ---------- */
document.addEventListener('click',function(e){var t=e.target.closest('[data-act]');if(!t||t.matches('input,select,textarea'))return;var a=t.getAttribute('data-act'),id=t.getAttribute('data-id'),v=t.getAttribute('data-v');
  if(a==='d'||a==='ds'){if(a==='ds'){var u=location.href.split('#')[0].replace('admin=1','')+'#p='+encodeURIComponent(id);if(navigator.share)navigator.share({title:shop.name,url:u}).catch(function(){});else if(navigator.clipboard)navigator.clipboard.writeText(u);}else detail(id);return;}
  if(a==='h'){if(fav[id])delete fav[id];else fav[id]=1;keep();draw(1);return;}
  if(a==='ad'||a==='mn'){var p=prod(id);if(!p)return;var n=cart[id]||0;if(a==='ad'){if(n+1>cap(p))return;n++;}else n--;if(n<=0)delete cart[id];else cart[id]=n;draw(1);if(view==='c')cartView();return;}
  if(a==='x'){close();return;}if(a==='cv'){cartView();return;}if(a==='cz'){custom();return;}if(a==='o'){myOrders();return;}if(a==='i'){info();return;}if(a==='chat'){location.href='community.html';return;}
  if(a==='hm'){F.sv=0;draw();window.scrollTo({top:0,behavior:'smooth'});return;}if(a==='sv'){F.sv=F.sv?0:1;draw();return;}
  if(a==='fo'){setSheet('Filters','sliders',fltHTML());view='flt';return;}
  if(a==='ca'){F={cat:{},min:'',max:'',inn:0,sv:0,sort:F.sort};draw();return;}
  if(a==='rf'){var k=t.getAttribute('data-k');if(k.indexOf('c:')===0)delete F.cat[k.slice(2)];else if(k==='pr'){F.min='';F.max='';}else if(k==='in')F.inn=0;else if(k==='sv')F.sv=0;draw();return;}
  if(a==='sh'){if(navigator.share)navigator.share({title:shop.name,url:location.href}).catch(function(){});else if(navigator.clipboard)navigator.clipboard.writeText(location.href);return;}
  if(a==='tm'){KTheme.set(v);custom();return;}if(a==='tc'){KTheme.set(null,v);custom();return;}if(a==='ug'){ui.g=v;keep();applyUI();custom();return;}
  if(a==='ax'){B.close();return;}if(a==='as'){settings();return;}if(a==='ao'){adminOrders();return;}if(a==='pe'){prodEdit(id);return;}
  if(a==='cl'){if(navigator.clipboard)navigator.clipboard.writeText(v);B.toast('Copied');return;}if(a==='ol'){window.open(v,'_blank','noopener');return;}
  if(a==='ow'){window.open('https://wa.me/'+v,'_blank','noopener');return;}if(a==='os'){B.status(id,v).then(adminOrders);return;}
  if(a==='sc'){applyX({color:v});settings();return;}if(a==='gs'){applyX({grid:v});settings();return;}
  if(a==='ra'){var r=$('nr').value.trim();if(!r)return;applyX({rules:rules().concat([r])});settings();return;}if(a==='rd'){var L=rules().slice();L.splice(+v,1);applyX({rules:L});settings();return;}});
document.addEventListener('change',function(e){var t=e.target,a=t.getAttribute('data-act');
  if(a==='fc'){F.cat[t.getAttribute('data-k')]=t.checked;draw();return;}
  if(a==='fb'){if(t.checked){F.min=t.getAttribute('data-lo');F.max=t.getAttribute('data-hi');}else{F.min='';F.max='';}draw();return;}
  if(a==='fi'){F.inn=t.checked?1:0;draw();return;}if(a==='fs'){F.sv=t.checked?1:0;draw();return;}
  if(a==='ui'){ui.im=t.checked?1:0;keep();draw();return;}
  if(t.id==='fmin'||t.id==='fmax'){F.min=$('fmin').value;F.max=$('fmax').value;draw();return;}
  if(t.id==='tcc'){KTheme.set(null,t.value);return;}
  if(t.id==='srt'){F.sort=t.value;draw(1);return;}
  if(ADMIN&&t.hasAttribute('data-x')){var k=t.getAttribute('data-x'),ty=t.getAttribute('data-t'),o={};o[k]=ty==='b'?(t.checked?1:0):ty==='n'?(+t.value||0):t.value.trim();applyX(o);return;}
  if(ADMIN&&t.hasAttribute('data-i')){var o2={};o2[t.getAttribute('data-i')]=t.getAttribute('data-t')==='b'?t.checked:t.value.trim();B.setInfo(o2);setTimeout(function(){sync();settings();after();},400);}});
$('q').addEventListener('input',function(){draw(1);});
document.addEventListener('keydown',function(e){if(e.key==='/'&&!/INPUT|TEXTAREA|SELECT/.test((document.activeElement||{}).tagName)){e.preventDefault();$('q').focus();}if(e.key==='Escape')close();});

/* ---------- start ---------- */
function fail(m){$('flt').innerHTML='';$('list').innerHTML='<div class="empty">'+ic('ban',36)+'<div>'+esc(m)+'</div></div>';rail();}
function ready(){$('q').hidden=false;$('srt').value=F.sort;if(ADMIN){$('adm').hidden=false;$('adm').innerHTML=ic('shield',20)+'<span class="t">Admin</span><button data-act="as">'+ic('settings',16)+'Settings</button><button data-act="ao">'+ic('package',16)+'Orders</button>';}
  KTheme.accent(X.color);if(!(JSON.parse(localStorage.getItem('kf-ui')||'{}')).g)ui.g=X.grid||'m';applyUI();head();draw();var dl=/#p=([^&]+)/.exec(location.hash);if(dl)detail(decodeURIComponent(dl[1]));}
$('list').innerHTML='<div class="grid">'+'<div class="sk"></div>'.repeat(6)+'</div>';
if(ADMIN){sync();ready();if(!shop._st.slug)settings();}
else{if(!slug||!sb||!C.URL){fail('Invalid store link');return;}
  sb.rpc('store_get',{p_slug:slug}).then(function(r){if(r.error||!r.data){fail('Store unavailable');return;}shop=r.data;X=shop.x||{};ready();
    sb.rpc('store_list').then(function(r2){var z=(Array.isArray(r2.data)?r2.data:[]).filter(function(x){return x.slug===slug;})[0];var bd=$('hero').querySelector('.bd');if(z&&z.cnt&&bd)bd.insertAdjacentHTML('afterbegin','<span>'+ic('star',14,1)+z.avg+' ('+z.cnt+')</span>');}).catch(function(){});
  }).catch(function(){fail('No internet');});}
})();
</script>
